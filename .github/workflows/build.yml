name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon (ARM64)
            arch: arm64
            artifact: Minicountant-macos-arm64.dmg
          - os: macos-13       # Intel (x86_64)
            arch: x86_64
            artifact: Minicountant-macos-x86_64.dmg
          - os: ubuntu-latest  # Linux x86_64
            arch: x86_64
            artifact: minicountant-linux-x86_64
          - os: ubuntu-22.04-arm  # Linux ARM64
            arch: arm64
            artifact: minicountant-linux-arm64
          - os: windows-latest  # Windows x86_64
            arch: x86_64
            artifact: minicountant-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller minicountant.spec --noconfirm

      # ── macOS: wrap .app into a DMG ─────────────────────────────────────
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/dmg_staging
          cp -r dist/Minicountant.app dist/dmg_staging/
          ln -s /Applications dist/dmg_staging/Applications
          hdiutil create \
            -volname "Minicountant" \
            -srcfolder dist/dmg_staging \
            -ov -format UDZO \
            "${{ matrix.artifact }}"

      # ── Linux: make executable and rename ───────────────────────────────
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/minicountant
          mv dist/minicountant "${{ matrix.artifact }}"

      # ── Windows: rename .exe ─────────────────────────────────────────────
      - name: Rename Windows binary
        if: runner.os == 'Windows'
        run: mv dist/minicountant.exe "${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      # ── Attach binaries to GitHub Release when a tag is pushed ──────────
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
